name: ai-reflow

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/node-app.Dockerfile
  image: ai-reflow-app:local
  env_file:
    - .env
  environment: &app-environment
    DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    API_HOST: 0.0.0.0
    API_PORT: 8787
    DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:?DEFAULT_WORKSPACE_ID is required}
    DEFAULT_WORKSPACE_SLUG: ${DEFAULT_WORKSPACE_SLUG:-demo}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    QUEUE_MODE: database
    WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-350}
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    AI_REFLOW_MODEL_API_KEY: ${AI_REFLOW_MODEL_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ./node_modules/.bin/tsx packages/platform/src/db/migrate.ts
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    profiles: ["demo"]
    command: ./node_modules/.bin/tsx packages/platform/src/db/seed.ts
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  server:
    <<: *app
    command: ./node_modules/.bin/tsx --tsconfig apps/server/tsconfig.json apps/server/src/main.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ./node_modules/.bin/tsx apps/worker/src/main.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: ai-reflow-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

